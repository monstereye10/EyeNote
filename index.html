<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EyeNote</title>
  <meta name="description" content="EyeNote download and account help.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="shell hero">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span></span></div>
        <div>
          <h1>EyeNote</h1>
          <p>Developed by Monstereye</p>
        </div>
      </div>
      <div class="hero-grid">
        <div>
          <p class="eyebrow">Notes + progress</p>
          <h2>A dark workspace for boards, tasks, notes, images, timers, and drawing.</h2>
          <p class="copy">Download EyeNote for Windows or use this site to finish account email links.</p>
          <div class="actions">
            <a class="button primary" href="https://github.com/monstereye10/EyeNote/releases/download/v1.0.0/EyeNote-Setup.exe">Download Windows</a>
            <a class="button" href="reset-password/">Reset password</a>
          </div>
        </div>
        <div class="preview" aria-label="EyeNote board preview">
          <div class="sidebar-card"></div>
          <div class="note-card one"></div>
          <div class="note-card two"></div>
          <div class="line"></div>
        </div>
      </div>
    </section>
  </main>

</html>
